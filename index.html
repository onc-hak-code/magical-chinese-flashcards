<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magical Chinese Flashcards</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Roboto:wght@300;400;700&display=swap');

    :root {
      --bg-dark: #1a1a2e;
      --bg-mid: #16213e;
      --bg-light: #0f3460;
      --card-light: #ffffff;
      --card-dark: #1a1a2e;
      --accent: #e94560;
      --accent-2: #ff2e63;
      --accent-3: #00e1d9;
      --gold: #fce38a;
      --soft: #dfe6f0;
      --muted: #9aa7b8;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, rgba(233, 69, 96, 0.15), transparent 30%),
                  linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
      color: white;
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    .app {
      position: relative;
      width: min(100%, 900px);
      min-height: 680px;
      padding: 24px 20px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .topbar {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 12px;
      z-index: 5;
    }

    h2 {
      margin: 0 0 8px;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: clamp(1.1rem, 2vw, 2rem);
    }

    .stats-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .stat-pill {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.8rem;
      color: #dfe6f0;
      letter-spacing: 0.04em;
    }

    .progress-bar {
      width: min(420px, 80vw);
      height: 11px;
      background: rgba(22, 33, 62, 0.9);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.07);
      margin: 12px auto 10px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.35s ease;
      border-radius: inherit;
    }

    .level-text {
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.03em;
    }

    .card-scene {
      position: relative;
      width: 300px;
      height: 430px;
      perspective: 1000px;
      cursor: pointer;
      margin-top: 12px;
      z-index: 4;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-radius: 22px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.45);
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      border: 4px solid rgba(255,255,255,0.9);
      overflow: hidden;
    }

    .card-front {
      background: linear-gradient(135deg, #ffffff 0%, #f3f4f8 100%);
      color: var(--bg-dark);
      flex-direction: column;
      gap: 12px;
    }

    .card-front::before {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 18px;
      border: 1px solid rgba(26,26,46,0.08);
    }

    .chinese-char {
      position: relative;
      z-index: 1;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 150px;
      line-height: 1;
      color: var(--bg-dark);
      filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.18));
    }

    .card-front .meaning {
      position: relative;
      z-index: 1;
      font-size: 0.9rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(26,26,46,0.7);
    }

    .card-back {
      background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%);
      color: white;
      border: 2px solid rgba(233, 69, 96, 0.7);
      transform: rotateY(180deg);
      flex-direction: column;
      gap: 8px;
      padding: 18px;
    }

    .pinyin {
      font-size: clamp(2rem, 3vw, 2.6rem);
      font-weight: 700;
      color: #f8d7db;
      letter-spacing: 0.04em;
    }

    .translation {
      font-size: 1.1rem;
      color: #dfe6f0;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hint {
      margin-top: 8px;
      font-size: 0.72rem;
      color: #b9c5d4;
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 18px;
      z-index: 5;
    }

    .action-btn {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: white;
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 10px 18px rgba(0,0,0,0.2);
    }

    .action-btn:hover {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    .primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .secondary {
      background: linear-gradient(135deg, #2f496f, #203864);
    }

    .success {
      background: linear-gradient(135deg, #1ab394, #16a085);
    }

    .warning {
      background: linear-gradient(135deg, #f59e0b, #d97706);
    }

    .hidden {
      display: none !important;
    }

    .particle {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      animation: explode 0.85s ease-out forwards;
      z-index: 15;
    }

    @keyframes explode {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(0);
        opacity: 0;
      }
    }

    .fly-away-left { animation: flyLeft 0.55s forwards; }
    .fly-away-right { animation: flyRight 0.55s forwards; }
    .fly-away-up { animation: flyUp 0.56s forwards; }

    @keyframes flyLeft {
      to {
        transform: translate(-100vw, -220px) rotate(-45deg);
        opacity: 0;
      }
    }

    @keyframes flyRight {
      to {
        transform: translate(100vw, -220px) rotate(45deg);
        opacity: 0;
      }
    }

    @keyframes flyUp {
      to {
        transform: translate(0, -110vh) scale(1.45);
        opacity: 0;
      }
    }

    @media (max-width: 560px) {
      .app {
        padding-top: 16px;
      }

      .card-scene {
        width: 250px;
        height: 380px;
      }

      .controls {
        width: 100%;
      }

      .action-btn {
        flex: 1 1 140px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <h2>Repetition Mode</h2>

      <div class="progress-bar">
        <div class="progress-fill" id="progressBar"></div>
      </div>

      <div class="level-text">
        Character <span id="charCount">1</span>/<span id="deckTotal">0</span>
        • Reps: <span id="repCount">0</span>/<span id="maxReps">20</span>
      </div>

      <div class="stats-row">
        <div class="stat-pill">Streak: <span id="streakCount">0</span></div>
        <div class="stat-pill">Mastered: <span id="masteredCount">0</span></div>
        <div class="stat-pill">Level: <span id="levelText">1</span></div>
      </div>
    </div>

    <div class="card-scene" id="cardScene">
      <div class="card" id="card">
        <div class="card-face card-front">
          <div class="chinese-char" id="charDisplay">人</div>
          <div class="meaning" id="meaningDisplay">Human</div>
        </div>

        <div class="card-face card-back">
          <div class="pinyin" id="pinyinDisplay">rén</div>
          <div class="translation" id="translationDisplay">person</div>
          <div class="hint">Tap to reveal</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="action-btn primary" id="revealBtn">Reveal</button>
      <button class="action-btn success hidden" id="rememberBtn">I Know</button>
      <button class="action-btn warning hidden" id="retryBtn">Review</button>
      <button class="action-btn secondary" id="nextBtn">Next</button>
    </div>
  </div>

  <script>
    const level1Chars = [
      { char: '人', pinyin: 'rén', meaning: 'person', english: 'person' },
      { char: '口', pinyin: 'kǒu', meaning: 'mouth', english: 'mouth' },
      { char: '大', pinyin: 'dà', meaning: 'big', english: 'big' },
      { char: '中', pinyin: 'zhōng', meaning: 'middle', english: 'middle' },
      { char: '小', pinyin: 'xiǎo', meaning: 'small', english: 'small' },
      { char: '山', pinyin: 'shān', meaning: 'mountain', english: 'mountain' },
      { char: '日', pinyin: 'rì', meaning: 'sun/day', english: 'sun' },
      { char: '月', pinyin: 'yuè', meaning: 'moon/month', english: 'moon' },
      { char: '水', pinyin: 'shuǐ', meaning: 'water', english: 'water' },
      { char: '火', pinyin: 'huǒ', meaning: 'fire', english: 'fire' },
      { char: '木', pinyin: 'mù', meaning: 'wood/tree', english: 'tree' },
      { char: '土', pinyin: 'tǔ', meaning: 'earth', english: 'earth' },
      { char: '天', pinyin: 'tiān', meaning: 'heaven', english: 'sky' },
      { char: '地', pinyin: 'dì', meaning: 'earth', english: 'ground' },
      { char: '门', pinyin: 'mén', meaning: 'door/gate', english: 'door' }
    ];

    const state = {
      deck: [],
      currentIndex: 0,
      currentCard: null,
      repsCompleted: 0,
      maxReps: 20,
      streak: 0,
      mastered: 0,
      currentLevel: 1,
      totalDeck: 0,
      revealed: false,
      masteryMap: new Map()
    };

    const card = document.getElementById('card');
    const charDisplay = document.getElementById('charDisplay');
    const meaningDisplay = document.getElementById('meaningDisplay');
    const pinyinDisplay = document.getElementById('pinyinDisplay');
    const translationDisplay = document.getElementById('translationDisplay');
    const progressBar = document.getElementById('progressBar');
    const repCountDisplay = document.getElementById('repCount');
    const charCountDisplay = document.getElementById('charCount');
    const deckTotalDisplay = document.getElementById('deckTotal');
    const streakCountDisplay = document.getElementById('streakCount');
    const masteredCountDisplay = document.getElementById('masteredCount');
    const levelTextDisplay = document.getElementById('levelText');
    const revealBtn = document.getElementById('revealBtn');
    const rememberBtn = document.getElementById('rememberBtn');
    const retryBtn = document.getElementById('retryBtn');
    const nextBtn = document.getElementById('nextBtn');

    function buildDeck() {
      state.deck = level1Chars.map((item, index) => ({
        ...item,
        mastery: 0,
        id: index + 1
      }));
      state.totalDeck = state.deck.length;
      deckTotalDisplay.textContent = state.totalDeck;
      state.currentIndex = 0;
      state.currentCard = state.deck[0];
      state.repsCompleted = 0;
      updateUI();
      loadCard();
    }

    function getCurrentCard() {
      return state.deck[state.currentIndex] || state.deck[0];
    }

    function loadCard() {
      const cardData = getCurrentCard();

      if (!cardData) return;

      state.currentCard = cardData;
      card.classList.remove('is-flipped', 'fly-away-left', 'fly-away-right', 'fly-away-up');
      card.style.display = 'block';

      charDisplay.textContent = cardData.char;
      meaningDisplay.textContent = cardData.meaning;
      pinyinDisplay.textContent = cardData.pinyin;
      translationDisplay.textContent = cardData.english;

      state.revealed = false;
      revealBtn.classList.remove('hidden');
      rememberBtn.classList.add('hidden');
      retryBtn.classList.add('hidden');

      charCountDisplay.textContent = state.currentIndex + 1;
      repCountDisplay.textContent = state.repsCompleted;
      updateProgress();
    }

    function toggleCard() {
      if (card.classList.contains('fly-away-left') ||
          card.classList.contains('fly-away-right') ||
          card.classList.contains('fly-away-up')) {
        return;
      }

      if (!state.revealed) {
        state.revealed = true;
        card.classList.add('is-flipped');
        revealBtn.classList.add('hidden');
        rememberBtn.classList.remove('hidden');
        retryBtn.classList.remove('hidden');
      }
    }

    function finishRep(success) {
      if (!state.currentCard) return;

      const cardData = state.currentCard;

      if (success) {
        cardData.mastery += 1;
        state.streak += 1;
      } else {
        cardData.mastery = Math.max(0, cardData.mastery - 1);
        state.streak = 0;
      }

      state.repsCompleted += 1;
      state.mastered = state.deck.filter(item => item.mastery >= 5).length;

      if (cardData.mastery >= 5) {
        triggerMagicEffect();
        setTimeout(() => {
          moveToNextCard();
        }, 500);
      } else {
        triggerMagicEffect();
        setTimeout(() => {
          loadCard();
        }, 500);
      }

      updateUI();
    }

    function moveToNextCard() {
      if (state.currentIndex < state.deck.length - 1) {
        state.currentIndex += 1;
      } else {
        state.currentIndex = 0;
      }

      const nextCard = getCurrentCard();
      if (nextCard) {
        loadCard();
      }
    }

    function nextCharacter() {
      state.repsCompleted = 0;
      if (state.currentIndex < state.deck.length - 1) {
        state.currentIndex += 1;
      } else {
        state.currentIndex = 0;
      }
      loadCard();
      updateUI();
    }

    function updateProgress() {
      const percent = (state.repsCompleted / state.maxReps) * 100;
      progressBar.style.width = percent + '%';
    }

    function updateUI() {
      repCountDisplay.textContent = state.repsCompleted;
      charCountDisplay.textContent = state.currentIndex + 1;
      streakCountDisplay.textContent = state.streak;
      masteredCountDisplay.textContent = state.mastered;
      levelTextDisplay.textContent = state.currentLevel;

      const percentage = (state.repsCompleted / state.maxReps) * 100;
      progressBar.style.width = percentage + '%';

      if (state.repsCompleted >= state.maxReps) {
        state.currentLevel += 1;
        state.repsCompleted = 0;
        setTimeout(() => {
          nextCharacter();
        }, 600);
      }
    }

    function triggerMagicEffect() {
      const animations = ['fly-away-left', 'fly-away-right', 'fly-away-up'];
      const randomAnim = animations[Math.floor(Math.random() * animations.length)];
      card.classList.add(randomAnim);

      const rect = card.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;
      createParticles(x, y);
    }

    function createParticles(x, y) {
      for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        document.body.appendChild(particle);

        const size = (Math.random() * 8 + 4) + 'px';
        particle.style.width = size;
        particle.style.height = size;

        const colors = ['#e94560', '#fce38a', '#00e1d9', '#ffffff'];
        particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

        particle.style.left = x + 'px';
        particle.style.top = y + 'px';

        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 220 + 80;
        const tx = Math.cos(angle) * velocity + 'px';
        const ty = Math.sin(angle) * velocity + 'px';

        particle.style.setProperty('--tx', tx);
        particle.style.setProperty('--ty', ty);

        setTimeout(() => particle.remove(), 800);
      }
    }

    revealBtn.addEventListener('click', toggleCard);
    rememberBtn.addEventListener('click', () => finishRep(true));
    retryBtn.addEventListener('click', () => finishRep(false));
    nextBtn.addEventListener('click', () => {
      if (state.revealed) {
        finishRep(false);
      } else {
        moveToNextCard();
      }
    });

    card.addEventListener('click', toggleCard);

    buildDeck();
  </script>
</body>
</html>
